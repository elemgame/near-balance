name: QA
on:
  pull_request:
    paths:
      - near-balance.sh
      - near-balance.bats
permissions:
  contents: read
jobs:
  qa:
    name: Lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ever-guild/quality-bash@v1.0.0-alpha.5
